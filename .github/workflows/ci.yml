name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0"
          python -m pip install -e ".[server,dev]"

      - name: Build package
        run: python -m build

      - name: Run tests
        run: python -m pytest -v

      - name: Check Python for fatal lint errors
        run: python -m ruff check . --select E9,F63,F7,F82

      - name: Validate browser JavaScript
        run: |
          node --check app.js
          node tests/test_app_logic.js

      - name: Smoke-test CLI
        run: |
          python cli.py classify --crs-type 1 --egfr 55 --map 75 --cvp 12
          python cli.py batch -i sample.csv -o out_smoke.csv

      - name: Audit installed Python dependencies
        run: pip-audit --skip-editable
