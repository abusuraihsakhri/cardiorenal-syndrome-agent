[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiorenal-syndrome-agent"
version = "2.1.0"
description = "Rule-based educational utilities for cardiorenal syndrome classification and kidney-function context."
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
dev = [
    "build>=1.2",
    "pip-audit>=2.7",
    "pytest>=8,<10",
    "ruff>=0.9",
]

[project.scripts]
cardiorenal-syndrome-agent = "cardiorenal_syndrome_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/cardiorenal-syndrome-agent"
Repository = "https://github.com/abusuraihsakhri/cardiorenal-syndrome-agent.git"

[tool.setuptools]
packages = ["agents", "cardiorenal_syndrome_agent"]
py-modules = [
    "biomarker_integration",
    "cardiorenal_sentinel",
    "cli",
    "crs_staging",
    "enrichment",
    "simulator",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
